name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Tests the latest coraza-http-wasm release against the local manifest,
      # so changes in this repository are validated before being released.
      - name: Run e2e tests
        run: go run mage.go e2eLocal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
